name: MAUI APK

# Builds the .NET MAUI port (maui/) on every push to the maui branch and keeps the APK as a
# workflow artifact. Independent of the Expo workflows; it never touches the "latest" release.
on:
  push:
    branches: [maui]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install the MAUI Android workload
        run: dotnet workload install maui-android

      - name: Check that the generated exercise data matches the TypeScript source
        run: |
          npm ci
          node maui/scripts/generate-exercises.mjs
          git diff --exit-code -- maui/GymBuddy.Core/Data

      - name: Unit tests
        run: dotnet test maui/GymBuddy.Tests/GymBuddy.Tests.csproj -c Release

      - name: Install missing Android SDK components
        run: >
          dotnet build maui/GymBuddy/GymBuddy.csproj -f net10.0-android -c Release
          -t:InstallAndroidDependencies
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True

      - name: Build release APK
        run: >
          dotnet publish maui/GymBuddy/GymBuddy.csproj -f net10.0-android -c Release
          -p:AndroidSdkDirectory="$ANDROID_HOME" -o out

      - name: Collect APK
        run: cp out/*-Signed.apk gym-buddy-maui.apk

      - uses: actions/upload-artifact@v7
        with:
          name: gym-buddy-maui-apk
          path: gym-buddy-maui.apk
